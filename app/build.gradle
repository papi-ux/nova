plugins {
    id 'com.android.application'
    id 'androidx.baselineprofile'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def signingPropsFile = rootProject.file("signing.properties")
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

def targetAbis = (project.findProperty("novaAbis") ?: "arm64-v8a,armeabi-v7a,x86_64")
        .toString()
        .split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
def fdroidBuild = project.findProperty("novaFdroid")?.toString()?.toBoolean() ?: false

// A beta's version name carries the channel from its git tag, so a tester's report says
// 1.4.13-beta.1 rather than an ambiguous "pre". Only the preRelease build type reads this.
def novaVersionSuffix = providers.gradleProperty("novaVersionSuffix").getOrElse("-pre")
if (!(novaVersionSuffix ==~ /^-(pre|beta\.[0-9]+|rc\.[0-9]+)$/)) {
    throw new GradleException("novaVersionSuffix must be -pre, -beta.N or -rc.N")
}

// Bumped once per release, and the only version number here that is maintained by hand. Stable
// reads it directly; the prerelease channel scales it, just below.
def novaVersionCode = 54

// Successive betas of one version have to be distinguishable, and the sequence has to keep rising
// across versions as well, because com.papi.nova.pre is a single application id: 1.4.14-beta.1 must
// outrank 1.4.13-beta.3. Adding the beta number to the base cannot do that. The base climbs by one
// per release while the beta count can climb further, so 1.4.14's base + 1 lands below 1.4.13's
// base + 3 and Android refuses the newer beta as a downgrade. Scaling the base gives every version
// its own block of a hundred codes instead:
//
//   -pre      base * 100          an untagged build, below every tagged beta of the same version
//   -beta.N   base * 100 + N      N is 1..49
//   -rc.N     base * 100 + 50 + N an rc always outranks every beta of its own version
//
// Deriving rather than hand-bumping is the point: a forgotten bump is what made beta.2 and beta.3
// both ship code 54, and every version pin stays at the plain version, which the channel design
// already relies on.
def novaPreReleaseChannelOrdinal = 0
def novaSuffixMatch = novaVersionSuffix =~ /^-(beta|rc)\.([0-9]+)$/
if (novaSuffixMatch.matches()) {
    def novaChannel = novaSuffixMatch.group(1)
    def novaChannelNumber = novaSuffixMatch.group(2).toInteger()
    // Past 49 the beta and rc bands would collide and an rc would stop outranking the betas.
    if (novaChannelNumber < 1 || novaChannelNumber > 49) {
        throw new GradleException(
                "novaVersionSuffix number must be 1..49, got ${novaChannelNumber} in ${novaVersionSuffix}")
    }
    novaPreReleaseChannelOrdinal = novaChannel == "rc" ? 50 + novaChannelNumber : novaChannelNumber
}
def novaPreReleaseVersionCode = novaVersionCode * 100 + novaPreReleaseChannelOrdinal

// Optional observer for audio socket timing; ordinary builds keep the original source.
def audioReceiveDiagnosticsValue = providers.gradleProperty("novaAudioReceiveDiagnostics").getOrElse("false")
if (!(audioReceiveDiagnosticsValue in ["true", "false"])) {
    throw new GradleException("novaAudioReceiveDiagnostics must be true or false")
}
def audioReceiveDiagnostics = audioReceiveDiagnosticsValue.toBoolean()

// Native debug checks inject synthetic FEC loss; disable only for delivery measurements.
def nativeDebugChecksValue = providers.gradleProperty("novaNativeDebugChecks").getOrElse("true")
if (!(nativeDebugChecksValue in ["true", "false"])) {
    throw new GradleException("novaNativeDebugChecks must be true or false")
}
def nativeDebugChecks = nativeDebugChecksValue == "true"

// Application.mk optimizes every variant by default; retain an explicit unoptimized debugger build.
def nativeOptimization = providers.gradleProperty("novaNativeOptimization").orNull
if (nativeOptimization != null && !(nativeOptimization in ["release", "debug"])) {
    throw new GradleException("novaNativeOptimization must be release or debug")
}

def moonlightCommonCPath = "src/main/jni/moonlight-core/moonlight-common-c"
def moonlightCommonCDir = file(moonlightCommonCPath)
def moonlightCommonCRequiredPaths = [
        "src/Connection.c",
        "enet/include/enet/enet.h",
        "reedsolomon/rs.c",
]
def moonlightCommonCRequiredFiles = moonlightCommonCRequiredPaths.collect { relativePath ->
    [relativePath: relativePath, sourceFile: file("${moonlightCommonCPath}/${relativePath}")]
}

// Resolved here rather than inside the task, because the configuration cache will not let a task
// body reach back into the build script for a file.
def moonlightNegotiationSource = file("${moonlightCommonCPath}/src/RtspConnection.c")
def moonlightPatchesPath = "src/main/jni/moonlight-core/patches"

TaskProvider<Task> verifyMoonlightCommonCSubmodule = tasks.register("verifyMoonlightCommonCSubmodule") {
    group = "verification"
    description = "Verifies that the moonlight-common-c git submodule is initialized before native builds run."

    doLast {
        def missingPaths = moonlightCommonCRequiredFiles.findAll { requiredFile ->
            !requiredFile.sourceFile.isFile()
        }.collect { requiredFile ->
            requiredFile.relativePath
        }

        if (!moonlightCommonCDir.isDirectory() || !missingPaths.isEmpty()) {
            throw new GradleException("""
Nova's native streaming sources are missing from ${moonlightCommonCPath}.

The moonlight-common-c git submodule must be initialized before Android native builds can run.
From the repository root, run:

    git submodule update --init --recursive

If you are cloning from scratch, prefer:

    git clone --recursive https://github.com/papi-ux/nova.git

Missing expected files:
${missingPaths.collect { "  - ${moonlightCommonCPath}/${it}" }.join("\n")}
""".stripIndent().trim())
        }

        // PyroWave is negotiated inside the streaming library, and Nova carries those changes as a
        // patch series rather than a fork. Without them the library does not know the format, so a
        // client that asks for it gets a session that negotiates something else while Nova has
        // already built a PyroWave renderer: a failure with no good error to give. Cheaper to find
        // out here, where the fix is one command.
        if (moonlightNegotiationSource.isFile() &&
                !moonlightNegotiationSource.text.contains("PYROWAVE_PROFILE_TOKEN")) {
            throw new GradleException("""
The moonlight-common-c submodule is missing Nova's PyroWave protocol patches.

From the repository root:

    cd ${moonlightCommonCPath}
    git checkout -b polaris-pyrowave
    git am ../patches/*.patch

See ${moonlightPatchesPath}/README.md for what they are and why they are a patch series rather
than a fork.
""".stripIndent().trim())
        }
    }
}

android {
    ndkVersion = "27.0.12077973"

    compileSdk = 36

    namespace = 'com.papi.nova'

    signingConfigs {
        nova {
            if (signingProps['storeFile']) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    defaultConfig {
        minSdk 21
        targetSdk 36

        versionName "1.4.13"
        // Stable's code stays a hand-maintained pin, bumped once per release. The prerelease
        // channel derives from it; see novaPreReleaseVersionCode above.
        versionCode = novaVersionCode

        buildConfigField "boolean", "FDROID_BUILD", fdroidBuild.toString()

        // Nordstern P0-4A (measurement-spec-v1.md 7.1). Overridden to true
        // only by the benchmark build type below - every other build type
        // gets this false default, same pattern FDROID_BUILD uses.
        buildConfigField "boolean", "BENCHMARK_BUILD", "false"
        // Whether this build may offer a codec that is still an experiment. A debug build and a beta
        // may; a release may not. It gates the value as well as the picker entry, so a release that
        // inherited the preference from a profile or a backup still streams as it always did.
        buildConfigField "boolean", "EXPERIMENTAL_CODECS", "false"

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            ndkBuild {
                arguments "NOVA_NATIVE_DEBUG_CHECKS=" + (nativeDebugChecks ? "1" : "0")
                arguments "NOVA_AUDIO_RECEIVE_DIAGNOSTICS=" + (audioReceiveDiagnostics ? "1" : "0")
                if (nativeOptimization != null) {
                    arguments "APP_OPTIM=" + nativeOptimization
                }
            }
        }
    }

    flavorDimensions "root"

    buildFeatures {
        buildConfig = true
        compose = true
        resValues = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            //noinspection ExpiredTargetSdkVersion
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "data:text/html;base64,PGgxPlJvb3QgYnVpbGQgaXMgbm90IGF2YWlsYWJsZTwvaDE+"

            applicationId "com.papi.nova.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot_game {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/%7B%22id%22%3A%22com.papi.nova%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2Fpapi-ux%2Fnova%22%2C%22author%22%3A%22papi-ux%22%2C%22name%22%3A%22Nova%22%2C%22additionalSettings%22%3A%22%7B%5C%22apkFilterRegEx%5C%22%3A%5C%22Nova-Android-arm64-v8a%5C%5C%5C%5C.apk%24%5C%22%2C%5C%22versionExtractionRegEx%5C%22%3A%5C%22v(.%2B)%5C%22%2C%5C%22matchGroupToUse%5C%22%3A%5C%221%5C%22%7D%22%7D"

            applicationId "com.papi.nova"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding = "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        baseline = file('lint-baseline.xml')
        lintConfig = file('lint.xml')
        abortOnError = project.hasProperty('lintFailOnError')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        resources {
            pickFirst 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            // BouncyCastle 1.85 ships a license and a notice in every one of its
            // three jars. Keep one copy of each rather than failing the merge.
            pickFirst 'META-INF/LICENSE.md'
            pickFirst 'META-INF/NOTICE.md'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            buildConfigField "boolean", "EXPERIMENTAL_CODECS", "true"
            resValue "string", "app_label", "Nova Debug"
            resValue "string", "app_label_root", "Nova Debug (Root)"
            resValue "string", "app_label_game", "Nova Debug (Game)"

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: Leave the following line alone!
            // No suffix needed — base applicationId is already com.papi.nova
            resValue "string", "app_label", "Nova"
            resValue "string", "app_label_root", "Nova (Root)"
            resValue "string", "app_label_game", "Nova (Game)"

            if (signingProps['storeFile']) {
                signingConfig = signingConfigs.nova
            }

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        preRelease {
            initWith release
            // After initWith, which copies release's value over.
            buildConfigField "boolean", "EXPERIMENTAL_CODECS", "true"
            applicationIdSuffix ".pre"
            versionNameSuffix novaVersionSuffix
            resValue "string", "app_label", "Nova Beta"
            resValue "string", "app_label_root", "Nova Beta (Root)"
            resValue "string", "app_label_game", "Nova Beta (Game)"
        }

        dirty {
            initWith release
            applicationIdSuffix ".dirty"
            versionNameSuffix "-dirty"
            resValue "string", "app_label", "Nova Dirty"
            resValue "string", "app_label_root", "Nova Dirty (Root)"
            resValue "string", "app_label_game", "Nova Dirty (Game)"
        }

        // Nordstern P0-4A (measurement-spec-v1.md 7.1): "based on release
        // optimization and runtime behavior... differ from release only
        // where required to enable bounded measurement capture, accept
        // non-persisted harness run identity, freeze and export an
        // app-private evidence file, permit adb run-as evidence
        // extraction." Same initWith-release + distinct applicationIdSuffix
        // shape as preRelease/dirty above - a separate, clearly-labeled
        // install, never colliding with a real release install on the same
        // device. No behavior changes live here yet; BENCHMARK_BUILD is the
        // gate later pieces build the actual capture path behind.
        benchmark {
            initWith release
            // adb run-as extraction (measurement-spec-v1.md 7.2) needs a
            // debuggable package - run-as refuses non-debuggable ones
            // outright, confirmed empirically (run-as: package not
            // debuggable) before adding this.
            debuggable true
            applicationIdSuffix ".benchmark"
            versionNameSuffix "-benchmark"
            resValue "string", "app_label", "Nova Benchmark"
            resValue "string", "app_label_root", "Nova Benchmark (Root)"
            resValue "string", "app_label_game", "Nova Benchmark (Game)"
            buildConfigField "boolean", "BENCHMARK_BUILD", "true"
        }
    }

    sourceSets {
        // The experimental codec picker entry, for the two build types that may offer it.
        debug.res.srcDirs += 'src/experimental/res'
        preRelease.res.srcDirs += 'src/experimental/res'
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    splits {
        abi {
            enable = true
            reset()
            include(*targetAbis)
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // A forked test JVM takes Java's default heap, not the daemon's, and Robolectric's
            // resource tables do not fit in it: the suite lost a different test to
            // "OutOfMemoryError: Java heap space" on three CI runs in one day.
            maxHeapSize = '2g'
        }
    }
}

// Build types cannot carry a versionCode, so the prerelease channel's derived code is applied to
// the variant outputs instead. Only preRelease is touched: stable, dirty and benchmark keep the pin.
androidComponents {
    onVariants(selector().withBuildType("preRelease")) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(novaPreReleaseVersionCode)
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    testImplementation platform('androidx.compose:compose-bom:2025.11.01')
    androidTestImplementation platform('androidx.compose:compose-bom:2025.11.01')

    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation project(':shared:polaris:model')
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    // BackHandler and the OnBackPressedDispatcher owner for Compose; the panel back chain runs on it.
    // Held at 1.8.2, the line appcompat already brings: activity 1.9 and later declare
    // ComponentActivity.onNewIntent with a non-null Intent, which Game.onNewIntent(Intent?) does not override.
    implementation 'androidx.activity:activity-compose:1.8.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Lifecycle and ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.lifecycle:lifecycle-runtime-testing:2.8.7'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    // Robolectric Compose tests for the panel foundation; ui-test-manifest (debug) supplies the activity.
    testImplementation 'androidx.compose.ui:ui-test-junit4'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}

baselineProfile {
    filter {
        include 'com.papi.nova.**'
    }
    variants {
        nonRoot_gameRelease {
            from project(':baselineprofile')
        }
    }
}

tasks.configureEach { task ->
    // Both spellings. AGP names these tasks after the native build system in use, so an ndk-build
    // project gets configureNdkBuildRelease and buildNdkBuildRelease and never the word
    // externalNativeBuild. Matching only the latter attached this guard to nothing at all: it
    // compiled, it read like protection in every review, and it never ran once. CI built release
    // APKs from an unpatched submodule for as long as that was true, which is the exact failure the
    // guard exists to prevent.
    if (task.name.contains("externalNativeBuild") || task.name.contains("NdkBuild")) {
        task.dependsOn(verifyMoonlightCommonCSubmodule)
    }
}

// AGP's cached packaged-manifest outputs can restore output metadata without the
// split AndroidManifest.xml files it references, which breaks downstream resource linking.
tasks.withType(com.android.build.gradle.tasks.ProcessPackagedManifestTask).configureEach {
    outputs.cacheIf { false }
}
