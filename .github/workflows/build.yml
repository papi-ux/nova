name: Build Nova APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      run_emulator_smoke:
        description: 'Run the slow emulator instrumentation smoke test'
        type: boolean
        default: false

jobs:
  verify:
    name: Lint and unit test
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Record exact source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Install adb without requesting the removed legacy tools package.
          packages: 'platform-tools'

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Lint debug build
        run: ./gradlew --no-build-cache -PnovaAbis=x86_64 -PlintFailOnError=true lintNonRoot_gameDebug

      - name: Run JVM tests
        run: ./gradlew --no-build-cache -PnovaAbis=x86_64 testNonRoot_gameDebugUnitTest

      - name: Run helper and onboarding tests
        run: python3 -m unittest tools.test_nova_retroid_smoke tools.test_native_submodule_preflight

  deck:
    name: Deck client build and tests
    runs-on: ubuntu-latest
    # The Deck client ships to SteamOS, which is Arch based. Ubuntu's Qt is 6.4
    # and the client uses QSGRenderNode APIs that are not in it, so building
    # here on Ubuntu would be testing a platform nothing ships to. Arch is the
    # closest widely available stand-in for the target.
    container: archlinux:latest

    steps:
      # Installed before checkout on purpose: without git in the container,
      # actions/checkout falls back to a REST download and silently skips
      # submodules, which this build requires.
      - name: Install Deck client build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git gcc cmake ninja pkgconf \
            qt6-base qt6-declarative \
            ffmpeg libva libdrm mesa \
            libpulse pipewire pipewire-audio opus openssl dbus python \
            libplacebo vulkan-headers vulkan-swrast \
            xorg-server-xvfb xorg-xauth xdotool ttf-dejavu

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          # moonlight-common-c lives under app/src/main/jni/moonlight-core and
          # carries enet as a submodule of its own. The Deck build fails at
          # configure time without both.
          submodules: recursive

      # actions/checkout writes the tree as the runner user while steps in a
      # container run as root, so git refuses the repository as dubiously
      # owned. One of the client's own tests shells out to git, and reads that
      # refusal as uncommitted changes.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: cmake -S clients/deck -B build-deck -G Ninja

      - name: Build
        run: cmake --build build-deck

      - name: Test
        env:
          # The client is a Qt Quick application and the runner has no display.
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-deck --output-on-failure

  deck-flatpak:
    name: Deck Alpha Flatpak
    needs: deck
    # The Deck client ships as an Alpha beside each release: one Flatpak bundle, built from
    # the tagged source in the runtime its manifest names. Manual runs build it too, so a
    # release tag is never the first time the bundle is built.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Build the Deck Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Nova-Deck-x86_64-alpha.flatpak
          manifest-path: clients/deck/packaging/flatpak/com.papi_ux.Nova.json
          # A release is built from its own tree every time; a cache keyed per commit never hits.
          cache: false
          upload-artifact: false

      - name: Keep the bundle for the release
        uses: actions/upload-artifact@v7
        with:
          name: nova-deck-flatpak
          path: Nova-Deck-x86_64-alpha.flatpak
          if-no-files-found: error
          # Long enough to re-run a failed release job without rebuilding the bundle.
          retention-days: 14

  android-smoke:
    name: Emulator smoke test
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_emulator_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Install adb without requesting the removed legacy tools package.
          packages: 'platform-tools'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Run instrumentation smoke test
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          target: default
          disk-size: 1024M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          script: ./gradlew --no-build-cache -PnovaAbis=x86_64 connectedNonRoot_gameDebugAndroidTest --stacktrace

  build:
    name: Assemble release APK
    needs: [verify, android-smoke, deck-flatpak]
    # A tag needs the Deck bundle. The job is skipped on pushes and pull requests by design, but on a
    # tag skipped means the Deck tests failed, and the release should stop here rather than sign
    # three APKs and fail at the missing bundle.
    if: ${{ always() && needs.verify.result == 'success' && (needs.android-smoke.result == 'success' || needs.android-smoke.result == 'skipped') && (needs.deck-flatpak.result == 'success' || (needs.deck-flatpak.result == 'skipped' && !startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The release job only needs cmdline-tools so the following sdkmanager
          # step can install the pinned NDK. Avoid the action's default
          # `tools platform-tools` install, because the obsolete `tools`
          # package currently pulls the Android Emulator and has produced
          # transient corrupt-zip setup failures before Gradle runs.
          packages: ''

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      # A beta is the same release, told early. The git tag carries the channel, so every version
      # pin stays at the plain version and only two things change. The build type becomes preRelease,
      # whose own applicationId installs beside a stable Nova instead of over it, so a beta can never
      # block a stable update through its versionCode. And the release itself is marked a prerelease.
      - name: Resolve release channel
        run: |
          set -euo pipefail

          channel=stable
          build_type=Release
          variant=release

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
              echo "Release tag must match vMAJOR.MINOR.PATCH with an optional -beta.N or -rc.N: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              channel=prerelease
              build_type=PreRelease
              variant=preRelease
              # The app carries which beta it is, so a tester's report says beta.1 or beta.2.
              echo "NOVA_VERSION_SUFFIX=-${GITHUB_REF_NAME#*-}" >> "$GITHUB_ENV"
            fi
          fi

          echo "NOVA_RELEASE_CHANNEL=${channel}" >> "$GITHUB_ENV"
          echo "NOVA_BUILD_TYPE=${build_type}" >> "$GITHUB_ENV"
          echo "NOVA_APK_VARIANT=${variant}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          set -euo pipefail

          gradle_flags=()
          if [ -n "${NOVA_VERSION_SUFFIX:-}" ]; then
            gradle_flags+=("-PnovaVersionSuffix=${NOVA_VERSION_SUFFIX}")
          fi
          ./gradlew --no-build-cache "${gradle_flags[@]}" "assembleNonRoot_game${NOVA_BUILD_TYPE}"

      - name: Sign APKs
        if: github.event_name != 'pull_request' && env.HAS_KEYSTORE_BASE64 == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.jks

          APK_DIR="app/build/outputs/apk/nonRoot_game/${NOVA_APK_VARIANT}"
          unsigned_apks=("${APK_DIR}"/*"${NOVA_APK_VARIANT}"-unsigned.apk)

          if [ "${#unsigned_apks[@]}" -eq 0 ]; then
            echo "No unsigned release APKs found in ${APK_DIR}" >&2
            exit 1
          fi

          BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools/" | sort -V | tail -1)"

          for APK in "${unsigned_apks[@]}"; do
            SIGNED_APK="${APK/-unsigned/}"

            "${BUILD_TOOLS}/zipalign" -v 4 "$APK" "${APK}.aligned"

            "${BUILD_TOOLS}/apksigner" sign \
              --ks /tmp/keystore.jks \
              --ks-key-alias ${{ secrets.KEY_ALIAS }} \
              --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.KEY_PASSWORD }} \
              --out "$SIGNED_APK" \
              "${APK}.aligned"
          done

      - name: Select APK artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob

          APK_DIR="app/build/outputs/apk/nonRoot_game/${NOVA_APK_VARIANT}"
          APK_ASSET_DIR="${PWD}/release-assets"
          mkdir -p "${APK_ASSET_DIR}"

          signed_apks=("${APK_DIR}"/*-"${NOVA_APK_VARIANT}".apk)

          if [ "${#signed_apks[@]}" -gt 0 ]; then
            apk_files=("${signed_apks[@]}")
          else
            apk_files=("${APK_DIR}"/*"${NOVA_APK_VARIANT}"-unsigned.apk)
          fi

          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No release APKs found in ${APK_DIR}" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* && "${#signed_apks[@]}" -eq 0 ]]; then
            echo "Refusing to publish unsigned APKs for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          # An asset name carries the ABI, never the channel: the release page says what channel it
          # is, the APK inside declares the .pre applicationId, and Obtainium's filter keeps matching.
          for apk in "${apk_files[@]}"; do
            apk_name="$(basename "$apk")"
            case "$apk_name" in
              *arm64-v8a*) abi="arm64-v8a" ;;
              *armeabi-v7a*) abi="armeabi-v7a" ;;
              *x86_64*) abi="x86_64" ;;
              *)
                echo "Could not determine ABI for ${apk_name}" >&2
                exit 1
                ;;
            esac

            if [[ "$apk_name" == *-unsigned.apk ]]; then
              asset_name="Nova-Android-${abi}-unsigned.apk"
            else
              asset_name="Nova-Android-${abi}.apk"
            fi

            cp "$apk" "${APK_ASSET_DIR}/${asset_name}"
          done

          echo "APK_ASSET_DIR=${APK_ASSET_DIR}" >> "$GITHUB_ENV"

      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob

          for apk in "${APK_ASSET_DIR}"/*.apk; do
            apk_dir="$(dirname "$apk")"
            apk_name="$(basename "$apk")"
            (
              cd "$apk_dir"
              sha256sum "$apk_name" > "$apk_name.sha256"
            )
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: nova-release-apk
          path: ${{ env.APK_ASSET_DIR }}/*
          if-no-files-found: error
          retention-days: 3

      # A tag always has the Deck bundle, since deck-flatpak runs for every tag. If it did
      # not build, the release refuses below for a missing asset rather than shipping without it.
      - name: Add the Deck Alpha bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v8
        with:
          name: nova-deck-flatpak
          path: ${{ env.APK_ASSET_DIR }}

      - name: Checksum the Deck Alpha bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cd "${APK_ASSET_DIR}"
          sha256sum Nova-Deck-x86_64-alpha.flatpak > Nova-Deck-x86_64-alpha.flatpak.sha256

      - name: Verify release tag matches built source
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.verify.outputs.source_commit }}
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH with an optional -beta.N or -rc.N: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$EXPECTED_SOURCE_COMMIT" ]; then
            echo "Release checkout $checked_out_commit does not match verified source $EXPECTED_SOURCE_COMMIT" >&2
            exit 1
          fi

          git tag -d "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
          git fetch --no-tags --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [ "$tag_commit" != "$EXPECTED_SOURCE_COMMIT" ]; then
            echo "Release tag ${GITHUB_REF_NAME} moved to $tag_commit; expected $EXPECTED_SOURCE_COMMIT" >&2
            exit 1
          fi

      - name: Stage curated GitHub release
        id: stage-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          expected_asset_names=(
            Nova-Android-arm64-v8a.apk
            Nova-Android-arm64-v8a.apk.sha256
            Nova-Android-armeabi-v7a.apk
            Nova-Android-armeabi-v7a.apk.sha256
            Nova-Android-x86_64.apk
            Nova-Android-x86_64.apk.sha256
            Nova-Deck-x86_64-alpha.flatpak
            Nova-Deck-x86_64-alpha.flatpak.sha256
          )
          release_assets=()
          for asset_name in "${expected_asset_names[@]}"; do
            release_asset="${APK_ASSET_DIR}/${asset_name}"
            if [ ! -f "$release_asset" ]; then
              echo "Missing release asset: $release_asset" >&2
              exit 1
            fi
            release_assets+=("$release_asset")
          done
          mapfile -t local_asset_names < <(
            find "${APK_ASSET_DIR}" -maxdepth 1 -type f -printf '%f\n' | sort
          )
          mapfile -t expected_asset_names < <(
            printf '%s\n' "${expected_asset_names[@]}" | sort
          )
          if [ "${local_asset_names[*]}" != "${expected_asset_names[*]}" ]; then
            echo "Local release assets do not match the exact eight-file contract" >&2
            printf 'expected: %s\n' "${expected_asset_names[*]}" >&2
            printf 'local: %s\n' "${local_asset_names[*]}" >&2
            exit 1
          fi
          release_notes="$RUNNER_TEMP/nova-release-notes.md"
          python3 scripts/extract_release_notes.py "${GITHUB_REF_NAME}" > "$release_notes"

          # Both paths carry the channel. A rerun that finds the release already staged takes the
          # edit path, and a beta that lost its flag there would publish as a stable release.
          channel=()
          if [ "${NOVA_RELEASE_CHANNEL}" = prerelease ]; then
            channel=(--prerelease)
          fi

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              "${channel[@]}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$release_notes"
            echo "publish_draft=true" >> "$GITHUB_OUTPUT"
          else
            gh release edit "${GITHUB_REF_NAME}" \
              --verify-tag \
              --draft=true \
              "${channel[@]}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$release_notes"
            echo "publish_draft=true" >> "$GITHUB_OUTPUT"
          fi

          expected_notes="$(cat "$release_notes")"
          published_notes="$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)"
          if [ "$published_notes" != "$expected_notes" ]; then
            echo "Published release notes do not match CHANGELOG.md" >&2
            exit 1
          fi

      - name: Upload GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          expected_asset_names=(
            Nova-Android-arm64-v8a.apk
            Nova-Android-arm64-v8a.apk.sha256
            Nova-Android-armeabi-v7a.apk
            Nova-Android-armeabi-v7a.apk.sha256
            Nova-Android-x86_64.apk
            Nova-Android-x86_64.apk.sha256
            Nova-Deck-x86_64-alpha.flatpak
            Nova-Deck-x86_64-alpha.flatpak.sha256
          )
          release_assets=()
          for asset_name in "${expected_asset_names[@]}"; do
            release_assets+=("${APK_ASSET_DIR}/${asset_name}")
          done
          gh release upload "${GITHUB_REF_NAME}" "${release_assets[@]}" --clobber

      - name: Verify GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          expected_assets=(
            Nova-Android-arm64-v8a.apk
            Nova-Android-arm64-v8a.apk.sha256
            Nova-Android-armeabi-v7a.apk
            Nova-Android-armeabi-v7a.apk.sha256
            Nova-Android-x86_64.apk
            Nova-Android-x86_64.apk.sha256
            Nova-Deck-x86_64-alpha.flatpak
            Nova-Deck-x86_64-alpha.flatpak.sha256
          )
          mapfile -t published_assets < <(
            gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort
          )
          mapfile -t expected_assets < <(printf '%s\n' "${expected_assets[@]}" | sort)
          if [ "${published_assets[*]}" != "${expected_assets[*]}" ]; then
            echo "Release assets do not match the exact eight-file contract on ${GITHUB_REF_NAME}" >&2
            printf 'expected: %s\n' "${expected_assets[*]}" >&2
            printf 'published: %s\n' "${published_assets[*]}" >&2
            exit 1
          fi

      - name: Publish verified draft release
        if: startsWith(github.ref, 'refs/tags/v') && steps.stage-release.outputs.publish_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A beta never becomes the newest release. Nova's own updater and Obtainium both read
          # releases/latest, which leaves out a release that is marked and not latest.
          if [ "${NOVA_RELEASE_CHANNEL}" = prerelease ]; then
            gh release edit "${GITHUB_REF_NAME}" --verify-tag --draft=false --prerelease --latest=false
          else
            gh release edit "${GITHUB_REF_NAME}" --verify-tag --draft=false
          fi
