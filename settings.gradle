pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // Explicitly declare Kotlin plugin versions here, as they are needed for resolution
        id("org.jetbrains.kotlin.multiplatform") version "2.3.21"
        id("org.jetbrains.kotlin.plugin.serialization") version "2.3.21"
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
    }
}

rootProject.name = "nova"
include ':app'
include ':baselineprofile'
include ':shared'
include ':shared:polaris'
include ':shared:polaris:model'
